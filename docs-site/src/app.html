<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') { new EventSource('/__cassor_reload').onmessage = (event) => { if (event.data === 'reload') location.reload(); }; }</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
