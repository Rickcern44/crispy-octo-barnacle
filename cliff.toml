[changelog]
header = """
# Changelog

All notable changes to Cassor are documented in this file.
"""
body = """
{% if version %}
## {{ version }} - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% endif %}
{% for group, commits in commits | group_by(attribute=\"group\") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end=\"\") }}`](https://github.com/Rickcern44/crispy-octo-barnacle/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
commit_parsers = [
  { message = ".*!", group = "Breaking Changes" },
  { body = ".*BREAKING CHANGE", group = "Breaking Changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true }
]

tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
